services:

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: npm
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - red_agencia_global

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: shopstore_web:1.0
    container_name: shop_web
    restart: unless-stopped
    ports:
      - "8081:80"
    networks:
      - red_agencia_global

  n8n:
    image: n8nio/n8n:latest
    container_name: shop_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - red_agencia_global

volumes:
  npm_data:
  npm_letsencrypt:
  n8n_data:

networks:
  red_agencia_global:
    external: true

